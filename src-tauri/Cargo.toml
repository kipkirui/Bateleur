[package]
name = "bateleur"
version = "0.2.0"
description = "Bateleur — a magazine-shaped desktop mail client"
authors = ["Kipkirui"]
license = "MIT"
repository = "https://github.com/kipkirui/Bateleur"
edition = "2021"

[lib]
name = "bateleur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bateleur-core = { path = "../crates/bateleur-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
imap = "2"
rustls = "0.23"
webpki-roots = "0.26"
rustls-native-certs = "0.8"
mail-parser = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "rustls-tls"] }
