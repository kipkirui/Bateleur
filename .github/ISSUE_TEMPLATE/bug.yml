name: Bug
description: Something is broken in the client
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this could leak mail, passwords, or API keys, do not file it here.
        See [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: What you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11, macOS 15, …
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you ran it
      options:
        - Windows MSI (prebuilt/windows)
        - Windows NSIS setup.exe (prebuilt/windows)
        - Portable Bateleur.exe (prebuilt/windows)
        - Compiled from source (tauri dev / bundle)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Installer filename (e.g. 0.27.5) or git commit.
      placeholder: 0.27.5
  - type: textarea
    id: extra
    attributes:
      label: Logs / screenshots
      description: Redact addresses and message bodies you do not want public.
